# nfpm configuration - one file, two outputs (deb and rpm).
#   VERSION=x.y.z ARCH=amd64 STAGE=/tmp/stage nfpm package -f packaging/linux/nfpm.yaml -p deb
# The staged tree comes from packaging/linux/build-tree.sh.

name: opulentus
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Opulentus
description: |
  Self-hosted AI agent that answers your business's phone and messages.
  Ships its own Python and Node runtimes; everything runs locally under
  /opt/opulentus with data in /var/lib/opulentus.
vendor: Opulentus
homepage: https://github.com/Adeeb-Hoque/opulentus
license: AGPL-3.0

contents:
  - src: ${STAGE}/opt/opulentus
    dst: /opt/opulentus
  - src: ${STAGE}/usr/lib/systemd/system/opulentus-api.service
    dst: /usr/lib/systemd/system/opulentus-api.service
  - src: ${STAGE}/usr/lib/systemd/system/opulentus-web.service
    dst: /usr/lib/systemd/system/opulentus-web.service
  # The operator's config: never overwritten on upgrade.
  - src: ${STAGE}/etc/opulentus/opulentus.env
    dst: /etc/opulentus/opulentus.env
    type: config|noreplace

scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
