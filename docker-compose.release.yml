# Opulentus from the published images - install without building anything.
#
#   cp .env.example .env        # set ENCRYPTION_KEY (openssl rand -hex 32)
#   docker compose -f docker-compose.release.yml up -d
#
# Same layout as docker-compose.yml (which builds from source), same volumes, same
# profiles - the two files are interchangeable on one machine because the volume
# names match. Pin a version with OPULENTUS_VERSION=0.1.0 in .env; unset means the
# newest release.
#
# **One honest limitation of the published web image:** the dashboard bakes the API's
# public address in at build time (NEXT_PUBLIC_API_URL), so the published image serves
# the standard case - browser and server on the same machine, API on
# http://localhost:38472. Reaching the dashboard under another hostname needs the web
# image rebuilt for it: use docker-compose.yml with OPULENTUS_PUBLIC_API_URL set.

services:
  api:
    image: ghcr.io/adeeb-hoque/opulentus-api:${OPULENTUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env - generate one with openssl rand -hex 32}"
      ENVIRONMENT: ${OPULENTUS_ENVIRONMENT:-production}
      DATABASE_URL: ${OPULENTUS_DATABASE_URL:-sqlite+aiosqlite:////data/opulentus.db}
      CORS_ORIGINS: ${OPULENTUS_WEB_ORIGIN:-http://localhost:38471}
      TRUSTED_HOSTS: ${OPULENTUS_TRUSTED_HOSTS:-localhost,127.0.0.1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - opulentus-data:/data
    ports:
      - "${OPULENTUS_API_LISTEN:-127.0.0.1:38472}:38472"

  web:
    image: ghcr.io/adeeb-hoque/opulentus-web:${OPULENTUS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OPULENTUS_WEB_LISTEN:-127.0.0.1:38471}:38471"

  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: opulentus
      POSTGRES_PASSWORD: ${OPULENTUS_POSTGRES_PASSWORD:-}
      POSTGRES_DB: opulentus
    volumes:
      - opulentus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opulentus -d opulentus"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    restart: unless-stopped
    volumes:
      - opulentus-n8n:/home/node/.n8n
    ports:
      - "${OPULENTUS_N8N_LISTEN:-127.0.0.1:5678}:5678"

volumes:
  opulentus-data:
  opulentus-postgres:
  opulentus-n8n:
